<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6fa">
    <title>You're offline · RSCJ Scheduler</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f5f6fa;color:#1e2538;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,420px);padding:30px;border:1px solid #e8eaf0;border-radius:22px;background:#fff;text-align:center;box-shadow:0 8px 24px #1e25380d}.mark{width:54px;height:54px;margin:0 auto 18px;display:grid;place-items:center;border-radius:17px;background:#665df2;color:#fff;font-size:13px;font-weight:800}.muted{color:#626c7e}button{min-height:48px;margin-top:10px;padding:0 20px;border:0;border-radius:12px;background:#665df2;color:#fff;font:inherit;font-weight:700}
    </style>
  </head>
  <body><main class="card"><div class="mark">RSCJ</div><h1>You're offline</h1><p class="muted">Reconnect to the internet to open your schedule and save updates.</p><button onclick="location.reload()">Try again</button></main></body>
</html>
