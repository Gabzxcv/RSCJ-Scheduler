<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You're offline — RSCJ Scheduler</title>
<style>
  :root { color-scheme: light dark; --bg: #f5f6fa; --card: #fff; --ink: #1e2538; --muted: #5d6578; --line: #e8eaf0; --primary: #665df2; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151823; --card: #1f2330; --ink: #eef0f6; --muted: #a5adbd; --line: #313649; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { width: min(100%, 380px); padding: 28px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .mark { width: 52px; height: 52px; margin: 0 auto 16px; display: grid; place-items: center; border-radius: 16px; background: var(--primary); color: #fff; font-weight: 800; font-size: 13px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 20px; color: var(--muted); }
  button { min-height: 48px; padding: 0 22px; border: 0; border-radius: 12px; background: var(--primary); color: #fff; font: inherit; font-weight: 700; }
</style>
</head>
<body>
<main>
  <div class="mark">RSCJ</div>
  <h1>You're offline</h1>
  <p>RSCJ Scheduler needs a connection to show the live schedule. Check your signal or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
